<!doctype html><meta charset="utf-8"><title>Safari 각주 회귀 검사</title>
<style>body{background:#151818;color:#eee;font:14px system-ui;margin:12px}button{padding:12px}pre{white-space:pre-wrap;height:120px;overflow:auto}iframe{width:1440px;height:900px;border:1px solid #555}</style>
<button id="run">각주 검사 실행</button><pre id="status">준비</pre><iframe id="site" src="../index.html"></iframe>
<script>
const f=document.querySelector('#site'),out=document.querySelector('#status'),wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{
 const errors=[],results=[];let count=0,maxMatrixError=0,debug=null;out.textContent='실행 중';document.querySelector('#run').disabled=true;
 const ok=(v,s)=>{if(!v)throw Error(s);count++};const until=async fn=>{let t=performance.now();while(!fn()){if(performance.now()-t>60000)throw Error('시간 초과');await wait(50)}};
 try{
 await until(()=>f.contentWindow.Atlas);const w=f.contentWindow,d=w.document;
 w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 const click=async s=>{ok(d.querySelector(s),'없는 버튼 '+s);d.querySelector(s).click();await wait(60)};
 const records=()=>[...d.querySelectorAll('.character-occurrence-label')].filter(n=>n.closest('[id$="-routes"]').style.display!=='none');
 async function inspect(name){
  // Safari의 백그라운드/저전력 RAF 지연에도 고정 타이머가 아닌 실제 두 번의 화면 갱신을 기다립니다.
  await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));
  const vp=d.querySelector('#map-viewport').getBoundingClientRect(),svg=d.querySelector('#map-overlay').getBoundingClientRect(),state=w.Atlas.getState();
  const representatives=w.CharacterLabels.groupRecords(records().map(node=>({node,key:node.dataset.contentKey,character:node.dataset.character,eventRef:node.dataset.eventRef,merge:node.dataset.mergeSummary==='true'}))).map(g=>g.members[0].node);
  let expected=0,shown=0;const boxes=[];
  for(const n of representatives){
   const p=n.parentElement,m=p.transform.baseVal.consolidate().matrix,anchor={x:svg.left+m.e*svg.width/4160,y:svg.top+m.f*svg.height/3016};
   const ctm=p.getScreenCTM();if(ctm)maxMatrixError=Math.max(maxMatrixError,Math.hypot(ctm.e-anchor.x,ctm.f-anchor.y));
   const inside=anchor.x>vp.left+10&&anchor.x<vp.right-10&&anchor.y>vp.top+10&&anchor.y<vp.bottom-10;
   if(inside)expected++;
   if(w.getComputedStyle(n).display==='none'){ok(!inside,'화면 안 각주 숨김 '+name+' '+n.dataset.fullLabel);continue;}
   shown++;const r=n.getBoundingClientRect();ok(r.width>0&&r.height>0,'빈 각주 '+name);ok([r.left,r.top,r.right,r.bottom].every(Number.isFinite),'유한좌표 '+name);
   debug={r:r.toJSON(),vp:vp.toJSON(),svg:svg.toJSON(),bbox:{x:n.getBBox().x,y:n.getBBox().y,width:n.getBBox().width,height:n.getBBox().height},x:n.getAttribute('x'),y:n.getAttribute('y'),transform:n.getAttribute('transform'),anchor,scale:state.scale};
   ok(r.left>=vp.left+6&&r.right<=vp.right-6&&r.top>=vp.top+6&&r.bottom<=vp.bottom-6,'각주 화면이탈 '+name+' '+n.textContent+' '+JSON.stringify({r:r.toJSON(),vp:vp.toJSON(),svg:svg.toJSON(),bbox:{x:n.getBBox().x,y:n.getBBox().y,width:n.getBBox().width,height:n.getBBox().height},x:n.getAttribute('x'),y:n.getAttribute('y'),anchor,scale:state.scale}));
   for(const b of boxes)ok(!(r.left<b.right-1&&r.right>b.left+1&&r.top<b.bottom-1&&r.bottom>b.top+1),'각주 겹침 '+name);boxes.push(r);
  }
  ok(!/NaN|undefined/.test(d.querySelector('#map-overlay').innerHTML),'잘못된 좌표 '+name);
  results.push({name,expected,shown});out.textContent=JSON.stringify({count,maxMatrixError,results},null,2);
 }
 await click('#enter');await until(()=>d.querySelector('#intro').hidden);await click('#tab-character');await click('#clear-selection');await click('#selection-list [data-id="kagan"]');await click('[data-journey="kagan"] [data-part="4"]');await wait(250);await inspect('케이건04');
 await click('[data-journey="kagan"] [data-part="0"]');await wait(10000);await inspect('케이건00');
 const ids=['tinahan','bihyung','ryun','samo','galrotek'];for(const id of ids){await click('#selection-list [data-id="'+id+'"]');await click('[data-journey="'+id+'"] [data-part="0"]')}
 await wait(22000);await inspect('6인00');
 for(let i=1;i<=5;i++){await click('#zoom-in');await wait(120);await inspect('확대'+i)}
 for(const key of ['ArrowLeft','ArrowUp','ArrowRight','ArrowDown']){d.querySelector('#map-viewport').dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true}));await wait(180);await inspect('이동 '+key)}
 await click('#reset-view');await wait(200);await inspect('전체복원');
 for(const [width,height]of [[390,844],[820,1180],[1440,900],[844,390]]){f.style.width=width+'px';f.style.height=height+'px';await wait(250);await inspect(width+'x'+height)}
 await click('#clear-selection');await wait(200);ok(records().length===0,'선택해제');ok(!errors.length,'콘솔오류 '+errors.join('/'));
 out.dataset.result='pass';document.title='PASS Safari 각주 '+count;out.textContent=JSON.stringify({result:'pass',count,maxMatrixError,results,errors},null,2);
 }catch(e){out.dataset.result='fail';document.title='FAIL Safari 각주';out.textContent=JSON.stringify({result:'fail',count,maxMatrixError,results,error:String(e).split(' {')[0],errors},null,2);if(debug)for(const [key,value]of Object.entries(debug)){const pre=document.createElement('pre');pre.textContent=JSON.stringify({key,value},null,2);document.body.append(pre)}}
};
</script>
