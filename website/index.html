<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121416" />
    <meta
      name="description"
      content="눈물을 마시는 새 — 인물과 사건의 길을 따라가는 인터랙티브 세계관 지도."
    />
    <title>눈물을 마시는 새 · 세계의 기록</title>
    <link
      rel="preload"
      href="./assets/fonts/PretendardUI.woff2?v=20261020-complete25"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./css/style.css?v=20261020-font25-final" />
    <!-- 빌드 도구 없이 동작하도록 일반 스크립트를 순서대로 불러옵니다. -->
    <script defer src="./js/grid.js"></script>
    <script defer src="./js/data.js?v=20261011-3"></script>
    <script defer src="./js/intro-snow.js?v=20261020-device-lifecycle25"></script>
    <script defer src="./js/app.js?v=20261020-device-lifecycle25"></script>
    <!-- 장소 원고와 상세 패널: 기존 좌표·경로 데이터는 변경하지 않습니다. -->
    <link rel="stylesheet" href="./css/location-details.css?v=20261016" />
    <script defer src="./js/location-data.js?v=20261019-samo-route"></script>
    <script defer src="./js/location-details.js?v=20261019-playback"></script>
    <!-- 구출대 파견 전용 확장: 기존 기능은 유지합니다. -->
    <link rel="stylesheet" href="./css/rescue.css?v=20261019-event-ids" />
    <link rel="stylesheet" href="./css/playback.css?v=20261019" />
    <script defer src="./js/playback.js?v=20261020-device-lifecycle25"></script>
    <script defer src="./js/rescue-data.js?v=20261011-3"></script>
    <script defer src="./js/rescue.js?v=20261019-final-qa"></script>
    <script defer src="./js/pursuit-data.js?v=20261011-3"></script>
    <script defer src="./js/war-data.js?v=20261019-samo-route"></script>
    <script defer src="./js/war.js?v=20261019-final-qa"></script>
    <!-- 인물 여정: 사건 원본의 경로와 좌표를 참조합니다. -->
    <script defer src="./js/occurrence-catalog.js?v=20261019-event-ids"></script>
    <script defer src="./js/kagan.js?v=20261019-event-ids"></script>
    <script defer src="./js/character-journeys.js?v=20261019-event-ids"></script>
    <!-- 인물 소개: 여정 패널 생성 후 소개만 추가합니다. -->
    <link rel="stylesheet" href="./css/character-profiles.css?v=20261018" />
    <script defer src="./js/character-profiles-data.js?v=20261019-samo-route"></script>
    <script defer src="./js/character-profiles.js?v=20261018"></script>
      <link rel="stylesheet" href="./css/landmarks.css?v=20261018-clean" />
    <script defer src="./js/landmarks.js?v=20261019-places"></script>
    <!-- 사건 소개: 인물 소개와 같은 시각 양식을 사용합니다. -->
    <script defer src="./js/event-profiles-data.js?v=20261018"></script>
    <script defer src="./js/event-profiles.js?v=20261018"></script>
    <!-- 인물 문구 충돌 회피: 사건/인물 표시기와 기본 거점 생성 후 연결합니다. -->
    <script defer src="./js/character-labels.js?v=20261020-device-lifecycle25"></script>
    <!-- PART 상세 원고와 표시: 기존 장소 상세와 분리합니다. -->
    <link rel="stylesheet" href="./css/part-details.css?v=20261018" />
    <script defer src="./js/part-details-data.js?v=20261019-samo-route"></script>
    <script defer src="./js/part-details.js?v=20261019-playback"></script>
    <!-- 거점 목록: 기존 소개 스타일과 공통 장소 상세를 재사용합니다. -->
    <link rel="stylesheet" href="./css/place-catalog.css?v=20261019" />
    <script defer src="./js/place-catalog-data.js?v=20261019"></script>
    <script defer src="./js/place-catalog.js?v=20261019-final-qa"></script>
      <link rel="stylesheet" href="./css/responsive.css?v=20261019-opt-final" />
  </head>
  <body>
    <!-- 표지: 검은 배경에 흰 픽셀 눈. 설정은 js/intro-snow.js에서 수정합니다. -->
    <section id="intro" class="intro" aria-label="눈물을 마시는 새 지도 입장">
      <canvas id="intro-snow" aria-hidden="true"></canvas>
      <button id="enter" class="enter" aria-label="세계의 기록 지도 열기">
        <span class="intro-kicker">이영도의 세계, 그 위에 남겨진 길</span>
        <img
          class="intro-logo"
          src="./assets/images/logo.webp"
          alt="눈물을 마시는 새"
          draggable="false"
        />
        <span class="enter-invitation"
          ><span class="drop" aria-hidden="true"></span>어디든 눌러, 이야기 속으로</span
        >
      </button>

    </section>

    <main id="atlas" class="atlas" hidden inert>
      <div class="workspace">
        <section
          id="map-viewport"
          class="map-viewport"
          tabindex="0"
          aria-label="세계 지도. 방향키로 이동, 더하기와 빼기로 확대 및 축소"
        >
          <!-- 이미지와 SVG는 같은 4160 × 3016 좌표계를 공유합니다. -->
          <div id="map-world" class="map-world">
            <img
              id="map-image"
              src="./assets/images/map-1040.webp"
              decoding="async"
              width="4160"
              height="3016"
              alt="눈물을 마시는 새 세계의 격자 지도"
              draggable="false"
            />
            <svg
              id="map-overlay"
              viewBox="0 0 4160 3016"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="선택한 경로와 위치"
            >
              <defs>
                <marker
                  id="route-arrow"
                  viewBox="0 0 10 10"
                  refX="9"
                  refY="5"
                  markerWidth="5"
                  markerHeight="5"
                  orient="auto-start-reverse"
                >
                  <path
                    d="M 1 1 L 9 5 L 1 9"
                    fill="none"
                    stroke="context-stroke"
                    stroke-width="1.5"
                  />
                </marker>
              </defs>
              <g id="route-layer"></g>
              <g id="place-layer"></g>
              <g id="character-layer"></g>
              <rect id="cell-highlight" width="44" height="44" rx="8" hidden />
            </svg>
          </div>
        <button id="home" class="home" aria-label="첫 화면으로 돌아가기">
          <img src="./assets/images/logo.webp" alt="눈물을 마시는 새" />
        </button>
          <p id="map-context" hidden></p>
          <div class="compass" aria-hidden="true">
            <span>N</span
            ><svg viewBox="0 0 40 52">
              <path d="M20 4 L28 36 L20 30 L12 36 Z" fill="none" stroke="currentColor" />
              <path d="M20 4V47" stroke="currentColor" />
            </svg>
          </div>
          <div class="map-bottom">
            <div class="map-tools" role="group" aria-label="지도 조작">
              <button id="zoom-out" aria-label="축소">−</button
              ><output id="zoom-value">100%</output
              ><button id="zoom-in" aria-label="확대">+</button><span></span
              ><button id="reset-view" aria-label="지도 전체 보기" title="지도 전체 보기">
                ⌖
              </button>
            </div>
            <button id="inspect-toggle" class="inspect-toggle" aria-pressed="false">
              격자 좌표 확인
            </button>
          </div>
          <div id="coordinate-readout" class="coordinate-readout" hidden>
            지도의 칸을 선택하세요.
          </div>
          <span class="map-hint">확대 후 드래그하여 이동 · 스크롤하여 확대</span>
        </section>
        <!-- 우측 패널은 지도 영역과 분리해 선택 지점을 가리지 않습니다. -->
        <aside class="sidebar" aria-label="지도 탐색과 위치 상세">
        <nav class="tabs" role="tablist" aria-label="탐색 분류">
          <button
            id="tab-event"
            role="tab"
            aria-selected="true"
            aria-controls="panel-body"
            data-tab="event"
          >
            Event<span>사건</span>
          </button>
          <button
            id="tab-character"
            role="tab"
            aria-selected="false"
            aria-controls="panel-body"
            tabindex="-1"
            data-tab="character"
          >
            Character<span>인물</span>
          </button>
          <button id="tab-place" role="tab" aria-selected="false" aria-controls="panel-body" tabindex="-1" data-tab="place">Place<span>거점</span></button>
        </nav>
          <div id="panel-body" role="tabpanel" aria-labelledby="tab-event">
            <div class="panel-heading">
              <span id="panel-eyebrow" class="eyebrow">EXPLORE THE STORY</span>
              <div>
                <h2 id="panel-title">사건의 기록</h2>
                <span id="panel-count">03</span>
              </div>
              <p id="panel-description">하나의 사건, 서로 다른 발걸음.</p>
            </div>
            <div id="selection-list" class="selection-list"></div>
            <div class="selection-summary">
              <span id="selection-count">선택된 사건 없음</span
              ><button id="clear-selection">선택 해제</button>
            </div>
          </div>
          <section id="detail" class="detail" aria-label="선택 정보">
            <span class="eyebrow">ON THE MAP</span>
            <h3>어떤 이야기를 따라갈까요?</h3>
            <p>사건이나 인물을 선택하고,<br />지도 위에 남겨진 기록을 살펴보세요.</p>
          </section>
          <details class="legend">
            <summary>지도의 표식 <span>+</span></summary>
            <div class="legend-content">
              <span><i class="legend-land"></i>기본 지형</span
              ><span><i class="legend-city"></i>주요 거점</span
              ><span><i class="legend-route"></i>이동 경로</span
              ><span><i class="legend-current"></i>인물의 위치</span>
              <p>경로와 위치는 선택한 인물의 색으로 표시됩니다.</p>
            </div>
          </details>
          <footer class="panel-footer">
            <span>눈물을 마시는 새</span><span>WORLD ARCHIVE</span>
          </footer>
        </aside>
      </div>
    </main>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    <noscript
      ><div class="noscript">
        지도를 탐색하려면 브라우저에서 JavaScript를 활성화해주세요.
      </div></noscript
    >
  </body>
</html>
